name: CI

on: ["workflow_dispatch", "push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.cache/bepinex
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run the Cake script
        uses: cake-build/cake-action@v2
        with:
          verbosity: Diagnostic

      - uses: actions/upload-artifact@v4
        with:
          name: MiraAPI.dll
          path: MiraAPI/bin/Release/net6.0/MiraAPI.dll

      - uses: actions/upload-artifact@v4
        with:
          name: ClazAU.MiraAPI.nupkg
          path: MiraAPI/bin/Release/ClazAU.MiraAPI.*.nupkg

      # A push to main whose VersionPrefix has no v<version> tag yet publishes that version: the package to the
      # ClazAU feed that mods compile against, and the DLL to a GitHub release. Asks the remote, since a shallow
      # checkout has no tags.
      - name: Check for an unreleased version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release
        if: steps.release.outputs.publish == 'true'
        run: dotnet build MiraAPI/MiraAPI.csproj --configuration Release -p:Version=${{ steps.release.outputs.version }}

      - name: Publish to the ClazAU NuGet feed
        if: steps.release.outputs.publish == 'true'
        run: >-
          dotnet nuget push "MiraAPI/bin/Release/ClazAU.MiraAPI.${{ steps.release.outputs.version }}.nupkg"
          --source "https://nuget.pkg.github.com/ClazAU/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"

      - uses: softprops/action-gh-release@v2
        if: steps.release.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.release.outputs.version }}
          files: MiraAPI/bin/Release/net6.0/MiraAPI.dll
